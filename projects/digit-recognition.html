<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit Recognition</title>

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/language.js" defer></script>
</head>

<body>

    <section class="hero">

        <div class="project-page">

            <p class="description" data-language-text="Draw a digit from 0 to 9 and see the magic unfold!">
                Draw a digit from 0 to 9 and see the magic unfold!
            </p>

            <div class="digit-container">

                <div class="digit-box">

                    <h3 data-language-text="Draw a digit (0–9)">Draw a digit (0–9)</h3>

                    <canvas id="canvas" width="220" height="220">
                    </canvas>

                    <div class="digit-actions">
                        <button id="clearBtn">
                            <span data-language-text="Clear">Clear</span>
                        </button>

                        <button id="predictBtn">
                            <span data-language-text="Predict">Predict</span>
                        </button>
                    </div>

                    <p id="demoStatus" class="demo-status" role="status" aria-live="polite">
                        Draw a digit from 0 to 9, then choose Predict.
                    </p>

                </div>

                <div class="digit-box result-box">

                    <h3 data-language-text="Prediction">Prediction</h3>

                    <img id="nn-gif" src="../images/nn.gif">

                    <div id="predictDisplay" class="prediction-display">

                    </div>

                </div>

            </div>

            <div class="links">
                <a href="../projects.html" data-language-text="← Back to Projects">← Back to Projects</a>
            </div>

        </div>

    </section>
    <script src="../js/digit-recognition.js?v=3" defer></script>
</body>

</html>
