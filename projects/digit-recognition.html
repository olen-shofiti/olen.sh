<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-language-text="Digit Recognition | NaK0">Digit Recognition | NaK0</title>
    <meta name="description" content="Draw a handwritten digit and run an in-browser machine learning model to recognize it." data-language-content="Draw a handwritten digit and run an in-browser machine learning model to recognize it.">
    <link rel="canonical" href="https://olen.sh/projects/digit-recognition.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NaK0">
    <meta property="og:title" content="Digit Recognition | NaK0" data-language-content="Digit Recognition | NaK0">
    <meta property="og:description" content="Draw a handwritten digit and run an in-browser machine learning model to recognize it." data-language-content="Draw a handwritten digit and run an in-browser machine learning model to recognize it.">
    <meta property="og:url" content="https://olen.sh/projects/digit-recognition.html">
    <meta property="og:image" content="https://olen.sh/images/yin-yang.webp">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Digit Recognition | NaK0" data-language-content="Digit Recognition | NaK0">
    <meta name="twitter:description" content="Draw a handwritten digit and run an in-browser machine learning model to recognize it." data-language-content="Draw a handwritten digit and run an in-browser machine learning model to recognize it.">
    <meta name="twitter:image" content="https://olen.sh/images/yin-yang.webp">
    <link rel="icon" type="image/png" href="../images/favicon.png">

    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/language.js" defer></script>
</head>

<body>

    <nav class="site-nav" aria-label="Primary navigation" data-language-aria="Primary navigation">
        <a href="../home.html" data-language-text="Home">Home</a>
        <a href="../projects.html" aria-current="location" data-language-text="Projects">Projects</a>
        <a href="../about.html" data-language-text="About">About</a>
    </nav>

    <section class="hero">

        <main class="project-page">

            <h1 data-language-text="Digit Recognition">Digit Recognition</h1>

            <p class="description" data-language-text="Draw a digit from 0 to 9 and see the magic unfold!">
                Draw a digit from 0 to 9 and see the magic unfold!
            </p>

            <div class="digit-container">

                <div class="digit-box">

                    <h2 data-language-text="Draw a digit (0–9)">Draw a digit (0–9)</h2>

                    <div class="digit-canvas-wrap">
                        <canvas id="canvas" width="220" height="220" tabindex="0" role="application"
                            aria-label="Digit drawing canvas" data-language-aria="Digit drawing canvas"
                            aria-describedby="digit-canvas-help"></canvas>
                        <span id="digit-cursor" class="digit-cursor" aria-hidden="true"></span>
                    </div>
                    <div class="digit-actions">
                        <button id="clearBtn">
                            <span data-language-text="Clear">Clear</span>
                        </button>

                        <button id="predictBtn">
                            <span data-language-text="Predict">Predict</span>
                        </button>
                    </div>

                    <p id="demoStatus" class="sr-only" role="status" aria-live="polite"></p>

                </div>

                <div class="digit-box result-box">

                    <h2 data-language-text="Prediction">Prediction</h2>

                    <div class="prediction-visual">
                        <picture>
                            <source srcset="../images/nn.webp" type="image/webp">
                            <img id="nn-gif" src="../images/nn.gif" width="259" height="255"
                                alt="" loading="lazy" decoding="async">
                        </picture>

                        <div id="predictDisplay" class="prediction-display" aria-live="polite">
                        </div>
                    </div>

                </div>

            </div>

            <div class="links">
                <a href="../projects.html" data-language-text="← Back to Projects">← Back to Projects</a>
            </div>

        </main>

    </section>
    <script src="../js/digit-recognition.js?v=3" defer></script>
</body>

</html>
